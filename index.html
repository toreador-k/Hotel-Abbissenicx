<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOTEL ABBISSENICX // THE PLAYGROUND</title>

<style>
@font-face{
  font-family:"Tickerbit Mono";
  src:url("fonts/Tickerbit-mono.woff") format("woff");
}

:root{
  color-scheme:dark;
  --ink:#f2eaff;
  --cyan:#75f4e4;
  --purple:#5016dc;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
}

body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:30px 14px;
  overflow-x:hidden;
  color:var(--ink);
  font-family:"Courier New",monospace;
  background:#09070d url("images/background.webp") center top / cover fixed no-repeat;
  position:relative;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    linear-gradient(
      rgba(8,5,15,.64),
      rgba(8,5,15,.78)
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      rgba(255,255,255,.025) 4px
    );
}

.machine{
  width:min(850px,96vw);
  position:relative;
  z-index:1;
  padding:18px 22px 26px;
  border:5px solid #17121c;
  border-radius:25px 25px 14px 14px;
  background:
     linear-gradient(
    90deg,
    #34394f,
    #6e7394 8%,
    #555b78 22%,
    #626985 50%,
    #555b78 78%,
    #6e7394 92%,
    #34394f
  );
  box-shadow:
    inset 0 2px #b9d8e655,
    inset 8px 0 14px #100c15,
    inset -8px 0 14px #100c15,
    0 28px 55px #000b;
}

.machine::before{
  content:"";
  position:absolute;
  inset:9px;
  border:1px solid #b9d8e633;
  border-radius:17px;
  pointer-events:none;
}

.machine::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:155px;
  z-index:0;
  border-radius:0 0 12px 12px;
  background:
   linear-gradient(
    90deg,
    #3d435a 0%,
    #59617d 8%,
    #6e7394 22%,
    #626985 50%,
    #6e7394 78%,
    #59617d 92%,
    #3a4056 100%
  );
  border-top:3px solid #3e455c;
  box-shadow:
    inset 0 5px 0 rgba(255,255,255,.10),
    inset 0 18px 22px rgba(0,0,0,.25),
    inset 6px 0 12px rgba(0,0,0,.28),
    inset -6px 0 12px rgba(0,0,0,.28),
    inset 0 -18px 25px rgba(0,0,0,.38),
    0 10px 18px rgba(0,0,0,.35);
}

.machine > *{
  position:relative;
  z-index:2;
}

/* MACHINE TOP */

.machine-top{
  position:relative;
  
  min-height:100px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 18px 15px;
  text-align:center;

  background:
  linear-gradient(
    180deg,
    #646a87 0%,
    #50566f 45%,
    #3d435a 100%
  );
  
  border-top:1px solid #b9d8e655;
  border-bottom:2px solid #17121c;

  box-shadow:
    inset 0 2px 0 #b9d8e622,
    inset 0 -8px 14px #130e18aa,
    0 3px 0 #0d0910;

  text-shadow:none;
}

.machine-top::before{
  content:"";
  position:absolute;
  inset:3px;

  border-radius:18px 18px 3px 3px;

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.06),
    inset 0 -5px 8px rgba(0,0,0,.22);

  pointer-events:none;
}

.machine-top::after{
  content:"";
  position:absolute;
  left:4%;
  right:4%;
  bottom:-4px;
  height:5px;
  background:linear-gradient(180deg,#66636b,#29272e);
  border-radius:0 0 3px 3px;
  box-shadow:0 2px 3px rgba(0,0,0,.35);
  pointer-events:none;
}

/* BRAND */

.machine-brand{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:14px;

  width:auto;
  max-width:100%;

  padding:2px 0 0;

  background:none;
  border:none;
  border-radius:0;
  box-shadow:none;
}

.machine-brand img{
  display:block;
  width:45px;
  height:45px;
  object-fit:contain;

  /* Keep the original 5016DC artwork visible. */
  filter:
    drop-shadow(0 1px 1px rgba(0,0,0,.45))
    drop-shadow(0 0 2px rgba(80,22,220,.22));
}

.brand-hotel{
  font-family:"Tickerbit Mono","Courier New",monospace;
  font-size:clamp(19px,4vw,31px);
  font-weight:normal;
  letter-spacing:.08em;
  color:#f4ddff;
  text-shadow:0 1px 0 rgba(255,255,255,.18);
  white-space:nowrap;
}

.machine-floor{
  color:#c9b5d8;
  font-size:11px;
  letter-spacing:.34em;
  opacity:.85;
}

/* CRT HOUSING */

.crt-frame{
  position:relative;
  margin-top:7px;
  padding:20px;
  border-radius:38px 38px 30px 30px;
  background:
    linear-gradient(
      145deg,
      #6e7394 0%,
      #555b78 18%,
      #28252d 42%,
      #18161c 70%,
      #34313a 100%
    );
  border:4px solid #35323a;
  box-shadow:
    0 5px 0 #242128,
    0 10px 17px rgba(0,0,0,.48),
    inset 0 3px 0 rgba(255,255,255,.16),
    inset 0 12px 18px rgba(0,0,0,.48),
    inset 0 -20px 28px rgba(0,0,0,.80),
    inset 8px 0 14px rgba(0,0,0,.32),
    inset -8px 0 14px rgba(0,0,0,.32);
}

.crt-frame::before{
  content:"";
  position:absolute;
  inset:9px;
  border-radius:31px 31px 23px 23px;
  pointer-events:none;
  border:1px solid rgba(215,190,230,.16);
}

/* CRT */

.crt{
  position:relative;
  min-height:520px;
  overflow:hidden;
  border:7px solid #08060b;
  border-radius:23px;
  background:#0d0914;
  box-shadow:
    inset 0 0 0 2px #443057,
    inset 0 0 50px #000,
    0 0 18px #9a50e333;
}

/*
  Dedicated visual layer behind the card.
  It stays inside the CRT and does not affect the card itself.
*/
.crt-background{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(69,32,92,.55) 0%,
      rgba(25,12,39,.74) 55%,
      rgba(6,5,11,.96) 100%
    );
}

.crt-background::before{
  content:"";
  position:absolute;
  inset:-8%;
  background:
    radial-gradient(
      ellipse at center,
      rgba(111,47,153,.22),
      transparent 62%
    );
  filter:blur(10px);
}

.crt::before{
  content:"";
  position:absolute;
  z-index:5;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      128deg,
      rgba(255,255,255,.08),
      transparent 24% 68%,
      rgba(165,119,255,.025)
    );
}

.crt::after{
  content:"";
  position:absolute;
  z-index:6;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 3px,
      #0007 4px
    );
}

.crt-ui{
  min-height:506px;
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:22px clamp(15px,4vw,32px) 18px;
}

/* HUD */

.hud-top,.hud-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.hud-title{
  color:#e9d8ff;
  font-size:14px;
  letter-spacing:.18em;
}

.hud-status{
  margin-top:7px;
  color:var(--cyan);
  font-size:10px;
  letter-spacing:.1em;
}

.senicx-hud{
  min-width:94px;
  padding:8px 12px;
  text-align:center;
  border:1px solid #b68aea66;
  border-radius:6px;
  background:#090710aa;
  box-shadow:inset 0 0 12px #a353ff22;
}

.senicx-label{
  color:#cbb3df;
  font-size:9px;
  letter-spacing:.25em;
}

.senicx-value{
  margin-top:3px;
  color:#fff0a1;
  font-family:Tickerbit Mono,monospace;
  font-size:25px;
  text-shadow:0 0 10px #ffcf5e77;
}

/* CARD */

.crt-card-stage{
  flex:1;
  min-height:305px;
  display:grid;
  place-items:center;
  perspective:1100px;
  padding:20px 0;
}

.card{
  position:relative;

  /* Original artwork ratio: 2156 × 3740 */
  height:min(410px,62vh);
  width:auto;
  aspect-ratio:2156 / 3740;

  transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.2,.75,.25,1);
  cursor:pointer;
}

.card.flipped{
  transform:rotateY(180deg);
}

.card-face{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:22px;
  border:2px solid #dfc2ff;
  border-radius:12px;
  backface-visibility:hidden;
  text-align:center;
  box-shadow:
    0 0 0 5px #311e40,
    0 12px 30px #000a,
    inset 0 0 28px #b083d722;
}

.card-front{
  background:
    radial-gradient(
      circle at 50% 25%,
      #4a2e60,
      #191020 76%
    );
}

.card-back{
  transform:rotateY(180deg);
  background:
    radial-gradient(
      circle at 50% 25%,
      #392544,
      #110d17 78%
    );
}

.card-front-inner{
  display:grid;
  gap:24px;
}

.card-number,.card-info-number{
  color:#cbb2e2;
  font-size:10px;
  letter-spacing:.2em;
}

.card-title{
  color:#fff0c1;
  font-family:Tickerbit Mono,"Courier New",monospace;
  font-size:clamp(23px,5vw,34px);
  line-height:1.2;
  text-shadow:0 0 14px #c17dff88;
}

.card-story{
  margin-top:20px;
  color:#eadff0;
  font-size:14px;
  line-height:1.65;
}

.hud-bottom{
  border-top:1px solid #c9a8dc3b;
  padding-top:13px;
}

.card-info-title{
  margin-top:5px;
  color:#fff0c1;
  font-size:12px;
  letter-spacing:.12em;
}

.collection-display{
  color:#baa9c8;
  font-size:9px;
  letter-spacing:.15em;
  text-align:right;
}

.collection-number{
  margin-top:5px;
  color:var(--cyan);
  font-size:12px;
}

/* CONTROL PANEL — projecting, inset mechanical deck */

.control-panel{
  position:relative;
  isolation:isolate;
  margin:18px -22px -26px;
  padding:22px 24px 18px;
  border:1px solid #8e9ab6;
  border-top:0;
  border-radius:0 0 13px 13px;
  background:
   linear-gradient(
    180deg,
    #6e7394 0%,
    #59617d 8%,
    #4a516b 32%,
    #3b4259 78%,
    #303548 100%
  );
  box-shadow:
    inset 0 1px 0 #b9d8e666,
    inset 0 9px 13px #120d18aa,
    inset 0 -3px 0 #100b14,
    0 3px 0 #17111b,
    0 10px 16px #0008;
}

/* Narrow seam where the deck meets the CRT housing. */
.control-panel::before{
  content:"";
  position:absolute;
  z-index:-1;
  top:0;
  left:12px;
  right:12px;
  height:5px;
border-top:1px solid #b9d8e655;
border-bottom:1px solid #171b25;
background:
  linear-gradient(
    180deg,
    #303548,
    #555b78
  );
  box-shadow:0 2px 5px #0008;
  pointer-events:none;
}

/* Thick front lip gives the deck a visible physical edge. */
.control-panel::after{
  content:"";
  position:absolute;
  z-index:-1;
  left:0;
  right:0;
  bottom:-7px;
  height:8px;
  border:1px solid #51445b;
  border-top:1px solid #8e9ab6;
  border-radius:0 0 12px 12px;
background:
  linear-gradient(
    180deg,
    #4a5169,
    #303548 72%,
    #171b25
  );
}

.controls{
  min-height:112px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:18px;
}

/* =====================================================
   JOYSTICK / RECESSED MOUNT
===================================================== */

.joystick{
  position:relative;
  width:68px;
  height:68px;
  flex:none;

  border:7px solid #17141b;
  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #0c0a0f 0%,
      #17131b 42%,
      #302b35 58%,
      #18141c 72%,
      #0a080d 100%
    );

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.08),
    inset 0 -8px 11px rgba(0,0,0,.75),

    /* mechanical collar */
    0 0 0 2px #0d0b10,
    0 0 0 4px #3c3541,

    0 4px 0 #09070b,
    0 7px 9px rgba(0,0,0,.45);
}

.joystick::before{
  content:"";

  position:absolute;
  width:11px;
  height:34px;

  left:21px;
  top:-29px;

  border-radius:4px;

  background:
    linear-gradient(
      90deg,
      #242027 0%,
      #756b7b 42%,
      #3a3440 72%,
      #17141a 100%
    );

  box-shadow:
    inset 1px 0 rgba(255,255,255,.16),
    inset -2px 0 rgba(0,0,0,.35),
    0 3px 5px rgba(0,0,0,.7);
}

.joystick::after{
  content:"";

  position:absolute;
  width:30px;
  height:30px;

  left:12px;
  top:-46px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 34% 28%,
      #6f6677 0%,
      #403947 34%,
      #242029 68%,
      #100e13 100%
    );

  border:1px solid #756b7d;

  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.13),
    inset 0 -5px 7px rgba(0,0,0,.7),
    0 4px 8px rgba(0,0,0,.75);
}

/* =====================================================
   DRAW / RECESSED MECHANICAL BUTTON
===================================================== */

.draw-button{
  position:relative;
  z-index:1;

  width:150px;
  height:58px;
  padding:0;

  border:0;
  border-radius:8px;

  color:#fff4df;
  font:700 21px Tickerbit Mono,"Courier New",monospace;
  letter-spacing:.2em;

  background:
    linear-gradient(
      180deg,
      #3a1c2b 0%,
      #24131f 100%
    );

  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.07),
    inset 0 -3px 5px rgba(0,0,0,.65),
    0 4px 0 #100b12,
    0 7px 10px rgba(0,0,0,.45);

  cursor:pointer;

  transition:
    transform .08s ease,
    filter .15s ease;
}


/* -----------------------------------------------------
   RECESSED MOUNTING BEZEL
----------------------------------------------------- */

.draw-button::before{
  content:"";

  position:absolute;
  z-index:-1;

  left:-10px;
  right:-10px;
  top:-9px;
  bottom:-9px;

  border:2px solid #292d3d;
  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #252938 0%,
      #171a24 100%
    );

  box-shadow:
    inset 0 2px 0 rgba(185,216,230,.12),
    inset 0 -5px 8px rgba(0,0,0,.55),
    0 2px 0 #0e1017,
    0 4px 7px rgba(0,0,0,.35);

  pointer-events:none;
}


/* -----------------------------------------------------
   BUTTON CAP
----------------------------------------------------- */

.draw-button::after{
  content:"";

  position:absolute;

  left:4px;
  right:4px;
  top:4px;
  bottom:7px;

  border-radius:5px;

  background:
    linear-gradient(
      180deg,
      #f47d68 0%,
      #d84b5d 48%,
      #a62c4c 100%
    );

  border-top:2px solid #ffad8e;
  border-left:1px solid #f37b6f;
  border-right:1px solid #a52d4c;
  border-bottom:3px solid #72203b;

  box-shadow:
    inset 0 2px 3px rgba(255,224,204,.32),
    inset 0 -5px 7px rgba(89,16,42,.55),
    0 2px 0 #1a0e16;

  pointer-events:none;
}


/* -----------------------------------------------------
   LABEL
----------------------------------------------------- */

.draw-button span{
  position:relative;
  z-index:2;

  display:block;

  transform:translateY(-1px);

  text-shadow:
    0 1px 0 rgba(255,255,255,.18),
    0 2px 3px rgba(70,15,30,.45);
}


/* -----------------------------------------------------
   HOVER
----------------------------------------------------- */

.draw-button:hover{
  filter:brightness(1.05);
}


/* -----------------------------------------------------
   PRESSED / PHYSICAL TRAVEL
----------------------------------------------------- */

.draw-button:active{
  transform:translateY(4px);

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.04),
    inset 0 -2px 4px rgba(0,0,0,.7),
    0 1px 0 #100b12,
    0 3px 5px rgba(0,0,0,.4);
}

.draw-button:active::after{
  top:6px;
  bottom:5px;

  border-top-color:#e06b60;

  box-shadow:
    inset 0 2px 4px rgba(0,0,0,.18),
    inset 0 -3px 5px rgba(89,16,42,.65);
}

/* =====================================================
   SENICX TOKEN RECEIVER
===================================================== */

.token-slot{
  position:relative;
  width:82px;
  padding:9px 10px 8px;
  box-sizing:border-box;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;

  background:
    linear-gradient(
      180deg,
      #37313d 0%,
      #29242f 52%,
      #1b1720 100%
    );

  border:1px solid #65596a;
  border-radius:5px;

  box-shadow:
    inset 0 1px rgba(255,255,255,.09),
    inset 0 -5px 7px rgba(0,0,0,.42),
    0 2px 0 #100c13;
}

.token-slot::before{
  content:"";
  position:absolute;
  inset:3px;

  border:1px solid rgba(0,0,0,.34);
  border-radius:3px;

  box-shadow:
    inset 0 1px rgba(255,255,255,.045);

  pointer-events:none;
}

.slot-hole{
  position:relative;
  z-index:1;

  width:57px;
  height:10px;
  box-sizing:border-box;

  border:2px solid #62586a;
  border-radius:7px;

  background:
    linear-gradient(
      180deg,
      #08070b,
      #151119 55%,
      #050408
    );

  box-shadow:
    inset 0 2px 3px #000,
    inset 0 -1px rgba(255,255,255,.07),
    0 1px rgba(255,255,255,.10);
}

.slot-label{
  position:relative;
  z-index:1;

  color:#b8a8c2;
  font-size:7px;
  letter-spacing:.16em;

  text-shadow:
    0 1px #100c13;
}

/* Reset will return as an external emergency control later. */
.reset-button{
  display:none;
}

.reset-button{
  display:block;
  margin:7px auto 0;
  padding:7px 12px;
  border:1px solid #bdaac766;
  border-radius:4px;
  color:#bcaec5;
  font:10px "Courier New",monospace;
  letter-spacing:.14em;
  background:#17121d;
  cursor:pointer;
}

.reset-button:hover{
  color:white;
  border-color:#e5caff;
}

button:focus-visible,
.card:focus-visible{
  outline:3px solid var(--cyan);
  outline-offset:4px;
}

/* MOBILE */

@media(max-width:600px){
  body{
    padding:14px 7px;
  }

  .machine{
    padding:11px 11px 19px;
    border-radius:19px 19px 11px 11px;
  }

.machine-top{
  position:relative;
  width:auto;
  max-width:none;
  min-height:82px;
  margin-left:0;
  margin-right:0;
  padding:8px 10px 12px;

  box-sizing:border-box;

  border-radius:14px 14px 3px 3px;
  overflow:hidden;
}

  .machine-brand{
    gap:8px;
    letter-spacing:.04em;
  }

  .machine-brand img{
    width:31px;
    height:31px;
  }

  .brand-hotel{
    font-size:clamp(15px,5vw,22px);
  }

  .machine-floor{
    font-size:9px;
  }

  .crt-frame{
    padding:9px;
    border-width:5px;
    border-radius:22px;
  }

  .crt{
    min-height:480px;
    border-width:5px;
    border-radius:16px;
  }

  .crt-ui{
    min-height:470px;
    padding:14px 11px 12px;
  }

  .hud-title{
    font-size:11px;
  }

  .hud-status{
    max-width:180px;
    font-size:8px;
  }

  .senicx-hud{
    min-width:75px;
    padding:6px 8px;
  }

  .senicx-value{
    font-size:21px;
  }

  .crt-card-stage{
    min-height:300px;
  }

  .card{
    height:min(350px,58vh);
  }

  .card-story{
    font-size:12px;
  }

  .control-panel{
    margin:13px -11px -19px;
    padding:23px 10px 15px;
  }

  .controls{
    gap:8px;
    min-height:95px;
  }

  .joystick{
    transform:scale(.8);
    margin:0 -5px;
  }

  .draw-button{
    min-width:108px;
    padding:14px 10px;
    font-size:17px;
  }

  .slot-hole{
    width:43px;
  }

  .slot-label{
    font-size:7px;
    letter-spacing:.08em;
  }
}

@media(max-height:760px) and (min-width:601px){
  body{
    align-items:start;
  }

  .crt{
    min-height:430px;
  }

  .crt-ui{
    min-height:416px;
  }

  .crt-card-stage{
    min-height:245px;
  }

  .card{
    height:min(350px,55vh);
  }
}
</style>
</head>


<body>


<div class="machine">


  <!-- MACHINE TOP -->

  <div class="machine-top">

<div class="machine-brand">
  <img src="images/LOGO.png">
  <span class="brand-hotel">HOTEL ABBISSENICX</span>
</div>

    <div class="machine-floor">
      FLOOR 2 · CASINO
    </div>

  </div>


  <!-- CRT FRAME -->

  <div class="crt-frame">

    <div class="crt">

      <div class="crt-background" aria-hidden="true"></div>

      <!-- CRT UI -->

      <div class="crt-ui">


        <!-- TOP HUD -->

        <div class="hud-top">

          <div>

            <div class="hud-title">
              THE PLAYGROUND
            </div>

            <div
              class="hud-status"
              id="status"
            >
              INSERT SENICX TO BEGIN
            </div>

          </div>


          <!-- SENICX -->

          <div class="senicx-hud">

            <div class="senicx-label">
              SENICX
            </div>

            <div
              class="senicx-value"
              id="tokenCount"
            >
              07
            </div>

          </div>

        </div>


        <!-- CARD -->

        <div class="crt-card-stage">

          <div
            class="card"
            id="card"
          >

            <!-- FRONT -->

            <div class="card-face card-front">

              <div class="card-front-inner">

                <div
                  class="card-number"
                  id="cardFrontNumber"
                >
                  CARD 000
                </div>

                <div
                  class="card-title"
                  id="cardFrontTitle"
                >
                  DRAW A CARD
                </div>

              </div>

            </div>


            <!-- BACK -->

            <div class="card-face card-back">

              <div
                class="card-number"
                id="cardBackNumber"
              >
                CARD 000
              </div>

              <div
                class="card-story"
                id="cardStory"
              >
                The machine waits for a guest.
              </div>

            </div>

          </div>

        </div>


        <!-- BOTTOM HUD -->

        <div class="hud-bottom">

          <div class="card-info">

            <div
              class="card-info-number"
              id="cardNumber"
            >
              CARD 000
            </div>

            <div
              class="card-info-title"
              id="cardTitle"
            >
              AWAITING GUEST
            </div>

          </div>


          <div class="collection-display">

            <div>
              COLLECTION
            </div>

            <div
              class="collection-number"
              id="collectionCount"
            >
              00 / 77
            </div>

          </div>

        </div>


      </div>

    </div>

  </div>


  <!-- CONTROL PANEL -->

  <div class="control-panel">

    <div class="controls">

      <div class="joystick"></div>

     <button
  class="draw-button"
  id="drawButton"
>
  <span>DRAW</span>
</button>

      <div class="token-slot">

        <div class="slot-hole"></div>

        <div class="slot-label">
          SENICX SLOT
        </div>

      </div>

    </div>


    <button
      class="reset-button"
      id="resetButton"
    >
      RESET GAME
    </button>

  </div>


</div>



<script>


/* =====================================================
   CARD DATABASE
===================================================== */

const cards = [

  {
    number: "001",
    title: "THE FOOL",
    story:
      "Every guest enters the hotel believing they are still going somewhere."
  },

  {
    number: "002",
    title: "THE WANDERER",
    story:
      "The corridor was longer than yesterday. Nobody remembered building another floor."
  },

  {
    number: "003",
    title: "THE VOID",
    story:
      "Some rooms contain nothing. Some rooms contain the reason you came."
  },

  {
    number: "004",
    title: "THE HOTEL",
    story:
      "Check-in is complimentary. Check-out is a matter of interpretation."
  },

  {
    number: "005",
    title: "THE PLAYGROUND",
    story:
      "The house has prepared a game for every guest. The house never loses."
  },

  {
    number: "006",
    title: "THE AFTERLIGHT",
    story:
      "When the lights finally disappear, something remains illuminated."
  }

];


/* =====================================================
   GAME STATE
===================================================== */


/*
   V5.4 FIX:
   A brand-new visitor receives 07 SENICX.
*/

const savedTokens =
  localStorage.getItem("senicxTokens");

let tokens =
  savedTokens === null
    ? 7
    : Number(savedTokens);


let collection =
  JSON.parse(
    localStorage.getItem(
      "abbissenicxCollection"
    ) || "[]"
  );


/* =====================================================
   ELEMENTS
===================================================== */

const drawButton =
  document.getElementById("drawButton");

const resetButton =
  document.getElementById("resetButton");

const card =
  document.getElementById("card");

const tokenCount =
  document.getElementById("tokenCount");

const collectionCount =
  document.getElementById("collectionCount");

const status =
  document.getElementById("status");

const cardNumber =
  document.getElementById("cardNumber");

const cardTitle =
  document.getElementById("cardTitle");

const cardFrontNumber =
  document.getElementById("cardFrontNumber");

const cardFrontTitle =
  document.getElementById("cardFrontTitle");

const cardBackNumber =
  document.getElementById("cardBackNumber");

const cardStory =
  document.getElementById("cardStory");


/* =====================================================
   DISPLAY UPDATE
===================================================== */

function updateDisplay() {

  tokenCount.textContent =
    String(tokens).padStart(2, "0");

  collectionCount.textContent =
    String(collection.length).padStart(2, "0")
    + " / 77";
}


/* =====================================================
   DRAW CARD
===================================================== */

drawButton.addEventListener(
  "click",
  () => {

    if (tokens <= 0) {

      status.textContent =
        "SENICX EMPTY // MACHINE LOCKED";

      return;
    }


    /* spend SENICX */

    tokens--;

    localStorage.setItem(
      "senicxTokens",
      tokens
    );

    updateDisplay();


    /* return card to front */

    card.classList.remove("flipped");


    status.textContent =
      "SENICX ACCEPTED";


    setTimeout(
      () => {

        status.textContent =
          "SEARCHING CARD DATABASE...";

      },
      450
    );


    setTimeout(
      () => {

        status.textContent =
          "LOCATING GUEST RECORD...";

      },
      900
    );


    setTimeout(
      () => {


        /* random card */

        const selected =
          cards[
            Math.floor(
              Math.random() *
              cards.length
            )
          ];


        /* update card */

        cardFrontNumber.textContent =
          "CARD " + selected.number;

        cardFrontTitle.textContent =
          selected.title;

        cardBackNumber.textContent =
          "CARD " + selected.number;

        cardStory.textContent =
          selected.story;


        cardNumber.textContent =
          "CARD " + selected.number;

        cardTitle.textContent =
          selected.title;


        /* new or duplicate */

        if (
          !collection.includes(
            selected.number
          )
        ) {


          collection.push(
            selected.number
          );


          localStorage.setItem(
            "abbissenicxCollection",
            JSON.stringify(collection)
          );


          status.textContent =
            "CARD FOUND // NEW ENTRY";


        } else {


          tokens++;


          localStorage.setItem(
            "senicxTokens",
            tokens
          );


          status.textContent =
            "DUPLICATE // SENICX RETURNED";

        }


        updateDisplay();


      },
      1350
    );

  }
);


/* =====================================================
   CARD FLIP
===================================================== */

card.addEventListener(
  "click",
  () => {

    if (
      cardNumber.textContent ===
      "CARD 000"
    ) {

      return;
    }


    card.classList.toggle(
      "flipped"
    );

  }
);


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
  "click",
  () => {

    tokens = 7;

    collection = [];


    localStorage.setItem(
      "senicxTokens",
      tokens
    );


    localStorage.setItem(
      "abbissenicxCollection",
      JSON.stringify(collection)
    );


    card.classList.remove(
      "flipped"
    );


    cardFrontNumber.textContent =
      "CARD 000";

    cardFrontTitle.textContent =
      "DRAW A CARD";

    cardBackNumber.textContent =
      "CARD 000";

    cardStory.textContent =
      "The machine waits for a guest.";


    cardNumber.textContent =
      "CARD 000";

    cardTitle.textContent =
      "AWAITING GUEST";


    status.textContent =
      "INSERT SENICX TO BEGIN";


    updateDisplay();

  }
);


/* =====================================================
   INITIAL DISPLAY
===================================================== */

updateDisplay();

</script>


</body>
</html>
