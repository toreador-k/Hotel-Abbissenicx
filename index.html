```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Playground - Card Machine</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at center,
                    #202020 0%,
                    #080808 70%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .container {

            width: 100%;

            max-width: 700px;

            padding: 40px 20px;

            text-align: center;

        }


        .subtitle {

            font-size: 12px;

            letter-spacing: 5px;

            opacity: 0.6;

            margin-bottom: 15px;

        }


        h1 {

            font-size: 50px;

            letter-spacing: 3px;

            margin-bottom: 15px;

        }


        .instruction {

            font-size: 14px;

            opacity: 0.65;

            margin-bottom: 35px;

        }


        .card-container {

            width: 320px;

            height: 450px;

            margin: 0 auto 35px;

            perspective: 1000px;

        }


        .card {

            width: 100%;

            height: 100%;

            position: relative;

            transform-style: preserve-3d;

            transition:
                transform 0.7s ease;

            cursor: pointer;

        }


        .card.flipped {

            transform:
                rotateY(180deg);

        }


        .card-face {

            position: absolute;

            width: 100%;

            height: 100%;

            backface-visibility: hidden;

            border:
                1px solid
                rgba(255,255,255,0.4);

            border-radius: 5px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .card-front {

            background: #252525;

        }


        .card-back {

            background: #eeeeee;

            color: #111;

            transform:
                rotateY(180deg);

        }


        .card-number {

            position: absolute;

            top: 25px;

            font-size: 10px;

            letter-spacing: 4px;

            opacity: 0.5;

        }


        .card-symbol {

            font-size: 65px;

            margin-bottom: 25px;

        }


        .card-front h2 {

            font-size: 30px;

            letter-spacing: 2px;

        }


        .card-back h2 {

            font-size: 28px;

            letter-spacing: 2px;

            margin-bottom: 25px;

        }


        .card-back p {

            max-width: 260px;

            line-height: 1.7;

            font-size: 14px;

        }


        .click-hint {

            position: absolute;

            bottom: 25px;

            font-size: 9px;

            letter-spacing: 3px;

            opacity: 0.4;

        }


        button {

            position: relative;

            z-index: 100;

            border:
                1px solid
                rgba(255,255,255,0.5);

            background: transparent;

            color: white;

            padding: 15px 30px;

            font-size: 11px;

            letter-spacing: 3px;

            cursor: pointer;

        }


        button:hover {

            background: white;

            color: black;

        }


        .draw-count {

            margin-top: 20px;

            font-size: 10px;

            letter-spacing: 2px;

            opacity: 0.4;

        }


        @media (max-width: 500px) {

            h1 {

                font-size: 36px;

            }

            .card-container {

                width: 280px;

                height: 420px;

            }

        }

    </style>

</head>


<body>


    <main class="container">


        <p class="subtitle">
            A RANDOM CARD MACHINE
        </p>


        <h1>
            THE PLAYGROUND
        </h1>


        <p class="instruction">
            Draw a card. Turn it over. See what waits behind it.
        </p>


        <div
            class="card-container"
            id="cardContainer"
        >

            <div
                class="card"
                id="card"
            >


                <div class="card-face card-front">

                    <div
                        class="card-number"
                        id="cardNumber"
                    >
                        CARD 000
                    </div>


                    <div class="card-symbol">
                        ✦
                    </div>


                    <h2 id="cardTitle">
                        READY?
                    </h2>


                    <p class="click-hint">
                        CLICK TO FLIP
                    </p>

                </div>


                <div class="card-face card-back">

                    <div class="card-number">
                        STORY
                    </div>


                    <h2 id="backTitle">
                        THE STORY
                    </h2>


                    <p id="cardStory">
                        Draw a card to reveal its story.
                    </p>


                    <p class="click-hint">
                        CLICK TO FLIP BACK
                    </p>

                </div>


            </div>

        </div>


        <button id="drawButton">
            DRAW A CARD
        </button>


        <p class="draw-count">

            CARDS DRAWN:

            <span id="drawCount">
                0
            </span>

        </p>


    </main>



    <script>

        const cards = [

            {
                number: "CARD 001",
                title: "THE FOOL",
                story:
                    "Every beginning carries a strange kind of courage."
            },

            {
                number: "CARD 002",
                title: "THE WANDERER",
                story:
                    "Some people leave because they know where they are going. Others leave because staying has become impossible."
            },

            {
                number: "CARD 003",
                title: "THE VOID",
                story:
                    "Sometimes the empty space is where everything begins to speak."
            },

            {
                number: "CARD 004",
                title: "THE HOTEL",
                story:
                    "Welcome to the hotel. Your room has already been prepared."
            },

            {
                number: "CARD 005",
                title: "THE PLAYGROUND",
                story:
                    "The playground is still open after midnight. The lights are on. The music is playing."
            },

            {
                number: "CARD 006",
                title: "THE AFTERLIGHT",
                story:
                    "After everything disappears, something remains. Not an answer. Just enough light to prove that you were there."
            }

        ];


        let drawTotal = 0;


        const button =
            document.getElementById("drawButton");


        const card =
            document.getElementById("card");


        button.addEventListener(
            "click",
            function() {

                const randomIndex =
                    Math.floor(
                        Math.random() * cards.length
                    );


                const selectedCard =
                    cards[randomIndex];


                document.getElementById(
                    "cardNumber"
                ).textContent =
                    selectedCard.number;


                document.getElementById(
                    "cardTitle"
                ).textContent =
                    selectedCard.title;


                document.getElementById(
                    "backTitle"
                ).textContent =
                    selectedCard.title;


                document.getElementById(
                    "cardStory"
                ).textContent =
                    selectedCard.story;


                card.classList.remove(
                    "flipped"
                );


                drawTotal++;


                document.getElementById(
                    "drawCount"
                ).textContent =
                    drawTotal;

            }
        );


        card.addEventListener(
            "click",
            function() {

                if (drawTotal === 0) {
                    return;
                }


                card.classList.toggle(
                    "flipped"
                );

            }
        );

    </script>


</body>

</html>
