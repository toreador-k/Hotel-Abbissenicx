<!DOCTYPE html>
<html>
<head>
    <title>Card Machine</title>
</head>

<body>

<h1>THE PLAYGROUND</h1>

<div>
    <p id="cardNumber">CARD 000</p>
    <h2 id="cardTitle">THE UNKNOWN</h2>
    <p id="cardStory">Draw a card to reveal its story.</p>
</div>

<button id="drawButton">
    DRAW A CARD
</button>

<script>
const cards = [
    {
        number: "CARD 001",
        title: "THE FOOL",
        story: "Every beginning carries a strange kind of courage."
    },
    {
        number: "CARD 002",
        title: "THE WANDERER",
        story: "Some people leave because they know where they are going. Others leave because staying has become impossible."
    },
    {
        number: "CARD 003",
        title: "THE VOID",
        story: "There is a silence that does not mean nothing. Sometimes the empty space is where everything begins to speak."
    },
    {
        number: "CARD 004",
        title: "THE HOTEL",
        story: "Welcome to the hotel. Your room has already been prepared. You do not remember making a reservation."
    },
    {
        number: "CARD 005",
        title: "THE PLAYGROUND",
        story: "The playground is still open after midnight. The lights are on. The music is playing."
    },
    {
        number: "CARD 006",
        title: "THE AFTERLIGHT",
        story: "After everything disappears, something remains. Not an answer. Just enough light to prove that you were there."
    }
];

const button = document.getElementById("drawButton");

button.addEventListener("click", function() {

    const randomIndex = Math.floor(Math.random() * cards.length);
    const selectedCard = cards[randomIndex];

    document.getElementById("cardNumber").textContent = selectedCard.number;
    document.getElementById("cardTitle").textContent = selectedCard.title;
    document.getElementById("cardStory").textContent = selectedCard.story;

});
</script>

</body>
</html>
