<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOTEL ABBISSENICX // THE PLAYGROUND</title>

<style>
@font-face{font-family:Tickerbit Mono;src:url("fonts/Tickerbit-mono.woff") format("woff")}
:root{color-scheme:dark;--ink:#f2eaff;--cyan:#75f4e4}*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;display:grid;place-items:center;padding:30px 14px;overflow-x:hidden;color:var(--ink);font-family:"Courier New",monospace;background:radial-gradient(ellipse at 50% 18%,#433252,#17101f 48%,#09070d)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 4px)}
.machine{width:min(850px,96vw);position:relative;padding:18px 22px 26px;border:5px solid #17121c;border-radius:25px 25px 14px 14px;background:linear-gradient(90deg,#211a27,#493b50 8%,#34283d 22%,#403449 50%,#34283d 78%,#493b50 92%,#211a27);box-shadow:inset 0 2px #8c7594,inset 8px 0 14px #100c15,inset -8px 0 14px #100c15,0 28px 55px #000b}
.machine:before{content:"";position:absolute;inset:9px;border:1px solid #c9a8dc33;border-radius:17px;pointer-events:none}.machine-top{min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:5px 10px 15px;text-align:center;text-shadow:0 0 14px #bb76ff80}
.machine-brand{display:flex;align-items:center;justify-content:center;gap:12px;font-family:Tickerbit Mono,"Courier New",monospace;font-size:clamp(19px,4vw,31px);letter-spacing:.08em;color:#f4ddff}.machine-brand img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 0 8px #bd83ff)}.machine-floor{color:#d4b8f6;font-size:11px;letter-spacing:.34em}
.crt-frame{position:relative;padding:18px;border:7px solid #17121c;border-radius:32px 32px 23px 23px;background:linear-gradient(145deg,#514558,#211a27 26%,#100d13 72%,#45374b);box-shadow:inset 0 3px #a58eaa55,inset 0 -12px 22px #000,0 7px 0 #110c14,0 14px 20px #0008}
.crt{position:relative;min-height:520px;overflow:hidden;border:7px solid #08060b;border-radius:23px;background:radial-gradient(ellipse at center,#26133c,#100b1a 72%,#08060d);box-shadow:inset 0 0 0 2px #443057,inset 0 0 50px #000,0 0 18px #9a50e333}.crt:before{content:"";position:absolute;z-index:5;inset:0;pointer-events:none;background:linear-gradient(128deg,#fff2,transparent 24% 68%,#a577ff0b)}.crt:after{content:"";position:absolute;z-index:6;inset:0;pointer-events:none;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 3px,#0007 4px)}
.crt-ui{min-height:506px;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;padding:22px clamp(15px,4vw,32px) 18px}.hud-top,.hud-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.hud-title{color:#e9d8ff;font-size:14px;letter-spacing:.18em}.hud-status{margin-top:7px;color:var(--cyan);font-size:10px;letter-spacing:.1em}.senicx-hud{min-width:94px;padding:8px 12px;text-align:center;border:1px solid #b68aea66;border-radius:6px;background:#090710aa;box-shadow:inset 0 0 12px #a353ff22}.senicx-label{color:#cbb3df;font-size:9px;letter-spacing:.25em}.senicx-value{margin-top:3px;color:#fff0a1;font-family:Tickerbit Mono,monospace;font-size:25px;text-shadow:0 0 10px #ffcf5e77}
.crt-card-stage{flex:1;min-height:305px;display:grid;place-items:center;perspective:1100px;padding:20px 0}.card{position:relative;width:min(270px,72vw);height:300px;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.75,.25,1);cursor:pointer}.card.flipped{transform:rotateY(180deg)}.card-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;border:2px solid #dfc2ff;border-radius:12px;backface-visibility:hidden;text-align:center;box-shadow:0 0 0 5px #311e40,0 12px 30px #000a,inset 0 0 28px #b083d722}.card-front{background:radial-gradient(circle at 50% 25%,#4a2e60,#191020 76%)}.card-back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 25%,#392544,#110d17 78%)}.card-front-inner{display:grid;gap:24px}.card-number,.card-info-number{color:#cbb2e2;font-size:10px;letter-spacing:.2em}.card-title{color:#fff0c1;font-family:Tickerbit Mono,"Courier New",monospace;font-size:clamp(23px,5vw,34px);line-height:1.2;text-shadow:0 0 14px #c17dff88}.card-story{margin-top:20px;color:#eadff0;font-size:14px;line-height:1.65}.hud-bottom{border-top:1px solid #c9a8dc3b;padding-top:13px}.card-info-title{margin-top:5px;color:#fff0c1;font-size:12px;letter-spacing:.12em}.collection-display{color:#baa9c8;font-size:9px;letter-spacing:.15em;text-align:right}.collection-number{margin-top:5px;color:var(--cyan);font-size:12px}
.control-panel{position:relative;margin:18px -22px -26px;padding:22px 24px 18px;border-top:5px solid #17121c;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#62536a,#403448 24%,#2a2231);box-shadow:inset 0 3px #b9a4c044,inset 0 -12px 18px #100b14,0 8px 12px #0006}.controls{min-height:112px;display:flex;align-items:center;justify-content:space-around;gap:18px}.joystick{position:relative;width:68px;height:68px;flex:none;border:7px solid #211a26;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8d7a96,#342a3b 65%,#17121c);box-shadow:inset 0 3px 7px #000a,0 4px #17121b}.joystick:before{content:"";position:absolute;width:12px;height:33px;left:21px;top:-29px;border-radius:7px;background:linear-gradient(90deg,#8f7c98,#e2d2e9 45%,#75647e);box-shadow:0 3px 5px #0009}.joystick:after{content:"";position:absolute;width:29px;height:29px;left:13px;top:-46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb1de,#db3f99 45%,#772257);box-shadow:0 4px 8px #000a,0 0 12px #ee64c255}
.draw-button{min-width:150px;padding:16px 28px;border:4px solid #4d182f;border-radius:12px;color:#fff4df;font:700 22px Tickerbit Mono,"Courier New",monospace;letter-spacing:.2em;background:linear-gradient(#ff9b69,#e54f62 48%,#a92250);box-shadow:inset 0 3px #ffd2b788,inset 0 -6px #741b3e,0 7px #171019,0 10px 12px #0008;cursor:pointer;transition:transform .08s,filter .15s}.draw-button:hover{filter:brightness(1.15)}.draw-button:active{transform:translateY(5px);box-shadow:inset 0 3px #ffd2b755,inset 0 -3px #741b3e,0 2px #171019}.token-slot{display:flex;flex-direction:column;align-items:center;gap:9px}.slot-hole{width:57px;height:10px;border:2px solid #75687c;border-radius:8px;background:#09070c;box-shadow:inset 0 2px 4px #000,0 1px #c5b1ce44}.slot-label{color:#d9c6e2;font-size:8px;letter-spacing:.18em}.reset-button{display:block;margin:7px auto 0;padding:7px 12px;border:1px solid #bdaac766;border-radius:4px;color:#bcaec5;font:10px "Courier New",monospace;letter-spacing:.14em;background:#17121d;cursor:pointer}.reset-button:hover{color:white;border-color:#e5caff}button:focus-visible,.card:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
@media(max-width:600px){body{padding:14px 7px}.machine{padding:11px 11px 19px;border-radius:19px 19px 11px 11px}.machine-top{min-height:82px}.machine-brand{gap:8px;letter-spacing:.04em}.machine-brand img{width:31px;height:31px}.machine-floor{font-size:9px}.crt-frame{padding:9px;border-width:5px;border-radius:22px}.crt{min-height:480px;border-width:5px;border-radius:16px}.crt-ui{min-height:470px;padding:14px 11px 12px}.hud-title{font-size:11px}.hud-status{max-width:180px;font-size:8px}.senicx-hud{min-width:75px;padding:6px 8px}.senicx-value{font-size:21px}.crt-card-stage{min-height:300px}.card{height:270px}.card-story{font-size:12px}.control-panel{margin:13px -11px -19px;padding:23px 10px 15px}.controls{gap:8px;min-height:95px}.joystick{transform:scale(.8);margin:0 -5px}.draw-button{min-width:108px;padding:14px 10px;font-size:17px}.slot-hole{width:43px}.slot-label{font-size:7px;letter-spacing:.08em}}
@media(max-height:760px) and (min-width:601px){body{align-items:start}.crt{min-height:430px}.crt-ui{min-height:416px}.crt-card-stage{min-height:245px}.card{height:245px}}
</style>
</head>


<body>


<div class="machine">


  <!-- MACHINE TOP -->

  <div class="machine-top">

<div class="machine-brand">
  <img src="images/LOGO.png">
  <span class="brand-hotel">HOTEL ABBISSENICX</span>
</div>

    <div class="machine-floor">
      FLOOR 2 · CASINO
    </div>

  </div>


  <!-- CRT FRAME -->

  <div class="crt-frame">

    <div class="crt">


      <!-- CRT UI -->

      <div class="crt-ui">


        <!-- TOP HUD -->

        <div class="hud-top">

          <div>

            <div class="hud-title">
              THE PLAYGROUND
            </div>

            <div
              class="hud-status"
              id="status"
            >
              INSERT SENICX TO BEGIN
            </div>

          </div>


          <!-- SENICX -->

          <div class="senicx-hud">

            <div class="senicx-label">
              SENICX
            </div>

            <div
              class="senicx-value"
              id="tokenCount"
            >
              07
            </div>

          </div>

        </div>


        <!-- CARD -->

        <div class="crt-card-stage">

          <div
            class="card"
            id="card"
          >

            <!-- FRONT -->

            <div class="card-face card-front">

              <div class="card-front-inner">

                <div
                  class="card-number"
                  id="cardFrontNumber"
                >
                  CARD 000
                </div>

                <div
                  class="card-title"
                  id="cardFrontTitle"
                >
                  DRAW A CARD
                </div>

              </div>

            </div>


            <!-- BACK -->

            <div class="card-face card-back">

              <div
                class="card-number"
                id="cardBackNumber"
              >
                CARD 000
              </div>

              <div
                class="card-story"
                id="cardStory"
              >
                The machine waits for a guest.
              </div>

            </div>

          </div>

        </div>


        <!-- BOTTOM HUD -->

        <div class="hud-bottom">

          <div class="card-info">

            <div
              class="card-info-number"
              id="cardNumber"
            >
              CARD 000
            </div>

            <div
              class="card-info-title"
              id="cardTitle"
            >
              AWAITING GUEST
            </div>

          </div>


          <div class="collection-display">

            <div>
              COLLECTION
            </div>

            <div
              class="collection-number"
              id="collectionCount"
            >
              00 / 77
            </div>

          </div>

        </div>


      </div>

    </div>

  </div>


  <!-- CONTROL PANEL -->

  <div class="control-panel">

    <div class="controls">

      <div class="joystick"></div>

     <button
  class="draw-button"
  id="drawButton"
>
  <span>DRAW</span>
</button>

      <div class="token-slot">

        <div class="slot-hole"></div>

        <div class="slot-label">
          SENICX SLOT
        </div>

      </div>

    </div>


    <button
      class="reset-button"
      id="resetButton"
    >
      RESET GAME
    </button>

  </div>


</div>



<script>


/* =====================================================
   CARD DATABASE
===================================================== */

const cards = [

  {
    number: "001",
    title: "THE FOOL",
    story:
      "Every guest enters the hotel believing they are still going somewhere."
  },

  {
    number: "002",
    title: "THE WANDERER",
    story:
      "The corridor was longer than yesterday. Nobody remembered building another floor."
  },

  {
    number: "003",
    title: "THE VOID",
    story:
      "Some rooms contain nothing. Some rooms contain the reason you came."
  },

  {
    number: "004",
    title: "THE HOTEL",
    story:
      "Check-in is complimentary. Check-out is a matter of interpretation."
  },

  {
    number: "005",
    title: "THE PLAYGROUND",
    story:
      "The house has prepared a game for every guest. The house never loses."
  },

  {
    number: "006",
    title: "THE AFTERLIGHT",
    story:
      "When the lights finally disappear, something remains illuminated."
  }

];


/* =====================================================
   GAME STATE
===================================================== */


/*
   V5.4 FIX:
   A brand-new visitor receives 07 SENICX.
*/

const savedTokens =
  localStorage.getItem("senicxTokens");

let tokens =
  savedTokens === null
    ? 7
    : Number(savedTokens);


let collection =
  JSON.parse(
    localStorage.getItem(
      "abbissenicxCollection"
    ) || "[]"
  );


/* =====================================================
   ELEMENTS
===================================================== */

const drawButton =
  document.getElementById("drawButton");

const resetButton =
  document.getElementById("resetButton");

const card =
  document.getElementById("card");

const tokenCount =
  document.getElementById("tokenCount");

const collectionCount =
  document.getElementById("collectionCount");

const status =
  document.getElementById("status");

const cardNumber =
  document.getElementById("cardNumber");

const cardTitle =
  document.getElementById("cardTitle");

const cardFrontNumber =
  document.getElementById("cardFrontNumber");

const cardFrontTitle =
  document.getElementById("cardFrontTitle");

const cardBackNumber =
  document.getElementById("cardBackNumber");

const cardStory =
  document.getElementById("cardStory");


/* =====================================================
   DISPLAY UPDATE
===================================================== */

function updateDisplay() {

  tokenCount.textContent =
    String(tokens).padStart(2, "0");

  collectionCount.textContent =
    String(collection.length).padStart(2, "0")
    + " / 77";
}


/* =====================================================
   DRAW CARD
===================================================== */

drawButton.addEventListener(
  "click",
  () => {

    if (tokens <= 0) {

      status.textContent =
        "SENICX EMPTY // MACHINE LOCKED";

      return;
    }


    /* spend SENICX */

    tokens--;

    localStorage.setItem(
      "senicxTokens",
      tokens
    );

    updateDisplay();


    /* return card to front */

    card.classList.remove("flipped");


    status.textContent =
      "SENICX ACCEPTED";


    setTimeout(
      () => {

        status.textContent =
          "SEARCHING CARD DATABASE...";

      },
      450
    );


    setTimeout(
      () => {

        status.textContent =
          "LOCATING GUEST RECORD...";

      },
      900
    );


    setTimeout(
      () => {


        /* random card */

        const selected =
          cards[
            Math.floor(
              Math.random() *
              cards.length
            )
          ];


        /* update card */

        cardFrontNumber.textContent =
          "CARD " + selected.number;

        cardFrontTitle.textContent =
          selected.title;

        cardBackNumber.textContent =
          "CARD " + selected.number;

        cardStory.textContent =
          selected.story;


        cardNumber.textContent =
          "CARD " + selected.number;

        cardTitle.textContent =
          selected.title;


        /* new or duplicate */

        if (
          !collection.includes(
            selected.number
          )
        ) {


          collection.push(
            selected.number
          );


          localStorage.setItem(
            "abbissenicxCollection",
            JSON.stringify(collection)
          );


          status.textContent =
            "CARD FOUND // NEW ENTRY";


        } else {


          tokens++;


          localStorage.setItem(
            "senicxTokens",
            tokens
          );


          status.textContent =
            "DUPLICATE // SENICX RETURNED";

        }


        updateDisplay();


      },
      1350
    );

  }
);


/* =====================================================
   CARD FLIP
===================================================== */

card.addEventListener(
  "click",
  () => {

    if (
      cardNumber.textContent ===
      "CARD 000"
    ) {

      return;
    }


    card.classList.toggle(
      "flipped"
    );

  }
);


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
  "click",
  () => {

    tokens = 7;

    collection = [];


    localStorage.setItem(
      "senicxTokens",
      tokens
    );


    localStorage.setItem(
      "abbissenicxCollection",
      JSON.stringify(collection)
    );


    card.classList.remove(
      "flipped"
    );


    cardFrontNumber.textContent =
      "CARD 000";

    cardFrontTitle.textContent =
      "DRAW A CARD";

    cardBackNumber.textContent =
      "CARD 000";

    cardStory.textContent =
      "The machine waits for a guest.";


    cardNumber.textContent =
      "CARD 000";

    cardTitle.textContent =
      "AWAITING GUEST";


    status.textContent =
      "INSERT SENICX TO BEGIN";


    updateDisplay();

  }
);


/* =====================================================
   INITIAL DISPLAY
===================================================== */

updateDisplay();

</script>


</body>
</html>
