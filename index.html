<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOTEL ABBISSENICX // THE PLAYGROUND</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: "Courier New", monospace;
  color: #eeeaff;

  background-image:
    linear-gradient(
      rgba(10, 6, 25, 0.42),
      rgba(10, 6, 25, 0.58)
    ),
    url("images/background.webp");

  background-size: cover;
  background-position: center;
  background-attachment: fixed;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 40px 20px;
}


/* =====================================================
   MACHINE
===================================================== */

.machine {
  width: min(820px, 96vw);

  position: relative;

  padding: 22px 22px 0;

  border-radius: 34px 34px 18px 18px;

  background:
    linear-gradient(
      145deg,
      #d5d4da 0%,
      #a7a6ad 18%,
      #77757f 48%,
      #b9b7bf 78%,
      #77757e 100%
    );

  border: 3px solid #55535c;

  box-shadow:
    0 45px 80px rgba(0,0,0,.72),
    0 15px 30px rgba(0,0,0,.5),
    inset 0 2px 0 rgba(255,255,255,.65),
    inset 0 -12px 25px rgba(0,0,0,.28);
}


/* little physical screws */

.machine::before,
.machine::after {
  content: "";
  position: absolute;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #eee,
      #888 40%,
      #444 75%
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.7),
    0 1px 2px rgba(0,0,0,.5);

  top: 15px;
}

.machine::before {
  left: 18px;
}

.machine::after {
  right: 18px;
}


/* =====================================================
   TOP LABEL
===================================================== */

.machine-top {
  padding: 10px 12px 18px;
  text-align: center;
}

.machine-brand {
  font-size: clamp(18px, 3vw, 27px);
  font-weight: bold;
  letter-spacing: .22em;

  color: #f7f5ff;

  text-shadow:
    0 1px 0 #555,
    0 2px 4px rgba(0,0,0,.5);
}

.machine-floor {
  margin-top: 5px;

  font-size: 10px;
  letter-spacing: .35em;

  color: #332b42;
}


/* =====================================================
   CRT FRAME
===================================================== */

.crt-frame {

  position: relative;

  padding: 25px;

  border-radius: 44px 44px 38px 38px;

  background:
    linear-gradient(
      135deg,
      #57545e,
      #27252d 35%,
      #45424b 70%,
      #19181e
    );

  border: 4px solid #35323b;

  box-shadow:
    inset 0 5px 10px rgba(255,255,255,.12),
    inset 0 -15px 30px rgba(0,0,0,.7),
    0 7px 10px rgba(0,0,0,.4);
}


/* =====================================================
   CRT SCREEN
===================================================== */

.crt {

  position: relative;

  width: 100%;
  height: 700px;

  overflow: hidden;

  border-radius: 45px / 34px;

  background:
    radial-gradient(
      ellipse at center,
      #171025 0%,
      #090711 70%,
      #030305 100%
    );

  border: 5px solid #121017;

  box-shadow:

    /* deep screen recess */
    inset 0 0 0 4px rgba(0,0,0,.8),

    inset 0 0 45px rgba(0,0,0,.95),

    inset 0 0 100px rgba(20,10,40,.75),

    /* screen glow */
    0 0 25px rgba(80,22,220,.18);
}


/* CRT scanlines */

.crt::after {

  content: "";

  position: absolute;
  inset: 0;

  pointer-events: none;

  z-index: 20;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.025) 0px,
      rgba(255,255,255,.025) 1px,
      rgba(0,0,0,.035) 2px,
      rgba(0,0,0,.035) 4px
    );

  mix-blend-mode: screen;
}


/* CRT glass reflection */

.crt::before {

  content: "";

  position: absolute;

  inset: -10% -20%;

  pointer-events: none;

  z-index: 30;

  background:
    linear-gradient(
      120deg,
      rgba(255,255,255,.13),
      rgba(255,255,255,.025) 25%,
      transparent 42%
    );

  transform: rotate(-3deg);

  opacity: .55;
}


/* =====================================================
   CRT HUD
===================================================== */

.crt-ui {

  position: absolute;
  inset: 0;

  z-index: 10;

  display: flex;
  flex-direction: column;

  padding: 24px 30px 26px;
}


/* top HUD */

.hud-top {

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  gap: 20px;

  flex-shrink: 0;
}


.hud-title {

  font-size: 13px;
  letter-spacing: .24em;

  color: #cfc6ff;

  text-shadow:
    0 0 7px rgba(100,70,255,.7);
}


.hud-status {

  margin-top: 7px;

  font-size: 9px;
  letter-spacing: .18em;

  color: #8f879f;

  min-height: 13px;
}


/* =====================================================
   BIG SENICX DISPLAY
===================================================== */

.senicx-hud {

  min-width: 205px;

  padding: 9px 14px 11px;

  border: 2px solid #676172;

  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      rgba(8,7,12,.92),
      rgba(22,18,31,.95)
    );

  box-shadow:
    inset 0 0 14px rgba(0,0,0,.9),
    0 0 10px rgba(80,22,220,.12);
}


.senicx-label {

  font-size: 8px;

  letter-spacing: .28em;

  color: #88818f;

  text-align: center;
}


.senicx-value {

  margin-top: 2px;

  text-align: center;

  font-family: "Courier New", monospace;

  font-size: clamp(28px, 5vw, 43px);

  line-height: 1;

  font-weight: bold;

  letter-spacing: .08em;

  color: #f1eaff;

  text-shadow:
    0 0 4px #fff,
    0 0 12px rgba(80,22,220,.8),
    0 0 25px rgba(80,22,220,.45);
}


/* =====================================================
   CARD AREA INSIDE SCREEN
===================================================== */

.crt-card-stage {

  flex: 1;

  min-height: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 15px 0;
}


/* =====================================================
   CARD
===================================================== */

.card {

  position: relative;

  height: min(465px, 67%);

  aspect-ratio: 2156 / 3740;

  cursor: pointer;

  transform-style: preserve-3d;

  transition:
    transform .75s cubic-bezier(.2,.7,.2,1),
    filter .3s ease;

  filter:
    drop-shadow(0 18px 25px rgba(0,0,0,.65))
    drop-shadow(0 0 18px rgba(80,22,220,.15));
}


.card:hover {

  filter:
    drop-shadow(0 20px 28px rgba(0,0,0,.7))
    drop-shadow(0 0 25px rgba(80,22,220,.28));
}


.card.flipped {

  transform: rotateY(180deg);
}


.card-face {

  position: absolute;

  inset: 0;

  backface-visibility: hidden;

  border-radius: 8px;

  overflow: hidden;

  border: 2px solid rgba(230,225,255,.5);

  background:
    linear-gradient(
      145deg,
      #15111d,
      #08060c
    );

  box-shadow:
    inset 0 0 20px rgba(0,0,0,.75),
    0 0 0 1px rgba(0,0,0,.7);
}


.card-front {

  display: flex;

  align-items: center;
  justify-content: center;

  padding: 25px;

  text-align: center;
}


.card-front-inner {

  font-size: clamp(15px, 2vw, 22px);

  line-height: 1.4;

  letter-spacing: .18em;

  color: #eeeaff;

  text-shadow:
    0 0 10px rgba(80,22,220,.6);
}


.card-number {

  font-size: 10px;

  color: #8f879f;

  letter-spacing: .3em;

  margin-bottom: 12px;
}


.card-title {

  font-size: clamp(20px, 3vw, 32px);

  font-weight: bold;

  letter-spacing: .08em;
}


/* back */

.card-back {

  transform: rotateY(180deg);

  padding: 25px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  text-align: left;
}


.card-back .card-number {

  margin-bottom: 15px;
}


.card-story {

  font-family: Georgia, serif;

  font-size: clamp(12px, 1.5vw, 15px);

  line-height: 1.65;

  color: #d9d2e8;
}


/* =====================================================
   BOTTOM HUD
===================================================== */

.hud-bottom {

  display: flex;

  justify-content: space-between;
  align-items: flex-end;

  gap: 20px;

  flex-shrink: 0;
}


.card-info {

  min-width: 0;
}


.card-info-number {

  font-size: 10px;

  letter-spacing: .25em;

  color: #817989;
}


.card-info-title {

  margin-top: 4px;

  font-size: 15px;

  letter-spacing: .12em;

  color: #eeeaff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.collection-display {

  text-align: right;

  font-size: 9px;

  line-height: 1.5;

  letter-spacing: .18em;

  color: #898291;
}


.collection-number {

  font-size: 17px;

  color: #e8e2ff;

  text-shadow:
    0 0 8px rgba(80,22,220,.6);
}


/* =====================================================
   CONTROL PANEL
===================================================== */

.control-panel {

  position: relative;

  margin: 0 -22px;

  padding: 24px 35px 30px;

  border-radius: 0 0 17px 17px;

  background:
    linear-gradient(
      180deg,
      #77747e 0%,
      #5d5a64 50%,
      #3f3c45 100%
    );

  border-top: 4px solid #89868f;

  box-shadow:
    inset 0 8px 15px rgba(255,255,255,.08),
    inset 0 -10px 20px rgba(0,0,0,.35);
}


/* panel seam */

.control-panel::before {

  content: "";

  position: absolute;

  left: 8%;
  right: 8%;
  top: 10px;

  height: 1px;

  background: rgba(0,0,0,.3);

  box-shadow:
    0 1px 0 rgba(255,255,255,.08);
}


.controls {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 28px;
}


/* joystick */

.joystick {

  position: relative;

  width: 58px;
  height: 58px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #57535e,
      #26232b 70%
    );

  border: 3px solid #29262e;

  box-shadow:
    inset 0 4px 5px rgba(255,255,255,.1),
    0 4px 5px rgba(0,0,0,.45);
}


.joystick::after {

  content: "";

  position: absolute;

  width: 25px;
  height: 25px;

  border-radius: 50%;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  background:
    radial-gradient(
      circle at 35% 30%,
      #a8a3af,
      #4a4650 70%
    );

  box-shadow:
    0 3px 4px rgba(0,0,0,.5);
}


/* draw button */

.draw-button {

  width: 110px;
  height: 58px;

  border-radius: 10px;

  border: 3px solid #29252f;

  background:
    linear-gradient(
      145deg,
      #6c3bea,
      #3b0da8
    );

  color: white;

  font-family: "Courier New", monospace;

  font-weight: bold;

  font-size: 13px;

  letter-spacing: .12em;

  cursor: pointer;

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.25),
    inset 0 -6px 10px rgba(0,0,0,.3),
    0 5px 7px rgba(0,0,0,.45);

  transition:
    transform .08s ease,
    filter .2s ease;
}


.draw-button:hover {

  filter: brightness(1.15);

}


.draw-button:active {

  transform: translateY(4px);

  box-shadow:
    inset 0 3px 8px rgba(0,0,0,.5),
    0 1px 2px rgba(0,0,0,.4);
}


/* token slot */

.token-slot {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 7px;
}


.slot-hole {

  width: 78px;
  height: 18px;

  border-radius: 10px;

  background: #18161c;

  border: 3px solid #2c2930;

  box-shadow:
    inset 0 3px 7px rgba(0,0,0,.9),
    0 1px 0 rgba(255,255,255,.12);
}


.slot-label {

  font-size: 8px;

  letter-spacing: .22em;

  color: #332f39;
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

  display: block;

  margin: 18px auto 0;

  border: none;

  background: transparent;

  color: #2e2a33;

  font-family: "Courier New", monospace;

  font-size: 8px;

  letter-spacing: .2em;

  cursor: pointer;

  opacity: .65;
}


.reset-button:hover {

  opacity: 1;

  color: #eeeaff;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  body {
    padding: 20px 10px;
  }

  .machine {
    padding: 14px 14px 0;
    border-radius: 25px 25px 14px 14px;
  }

  .crt-frame {
    padding: 13px;
    border-radius: 30px;
  }

  .crt {
    height: 610px;
    border-radius: 32px / 25px;
  }

  .crt-ui {
    padding: 18px 17px 20px;
  }

  .hud-top {
    gap: 8px;
  }

  .hud-title {
    font-size: 9px;
  }

  .hud-status {
    font-size: 7px;
  }

  .senicx-hud {
    min-width: 112px;
    padding: 7px 8px 9px;
  }

  .senicx-label {
    font-size: 6px;
  }

  .senicx-value {
    font-size: 27px;
  }

  .crt-card-stage {
    padding: 10px 0;
  }

  .card {
    height: min(390px, 65%);
  }

  .card-back {
    padding: 17px;
  }

  .card-story {
    font-size: 11px;
    line-height: 1.5;
  }

  .card-info-title {
    font-size: 11px;
  }

  .collection-display {
    font-size: 7px;
  }

  .collection-number {
    font-size: 13px;
  }

  .control-panel {
    margin: 0 -14px;
    padding: 18px 18px 23px;
  }

  .controls {
    gap: 16px;
  }

  .joystick {
    width: 48px;
    height: 48px;
  }

  .draw-button {
    width: 95px;
    height: 50px;
    font-size: 11px;
  }

  .slot-hole {
    width: 60px;
  }

}


/* =====================================================
   VERY SMALL SCREENS
===================================================== */

@media (max-height: 700px) and (min-width: 601px) {

  .crt {
    height: 570px;
  }

  .card {
    height: min(380px, 62%);
  }

}

</style>
</head>


<body>


<div class="machine">


  <!-- ===============================================
       MACHINE TOP
  ================================================ -->

  <div class="machine-top">

    <div class="machine-brand">
      HOTEL ABBISSENICX
    </div>

    <div class="machine-floor">
      FLOOR 2 : CASINO
    </div>

  </div>


  <!-- ===============================================
       CRT FRAME
  ================================================ -->

  <div class="crt-frame">

    <div class="crt">


      <!-- ===========================================
           EVERYTHING INSIDE THE CRT
      ============================================ -->

      <div class="crt-ui">


        <!-- TOP HUD -->

        <div class="hud-top">

          <div>

            <div class="hud-title">
              THE PLAYGROUND
            </div>

            <div
              class="hud-status"
              id="status"
            >
              INSERT SENICX TO BEGIN
            </div>

          </div>


          <!-- BIG SENICX -->

          <div class="senicx-hud">

            <div class="senicx-label">
              SENICX
            </div>

            <div
              class="senicx-value"
              id="tokenCount"
            >
              07
            </div>

          </div>

        </div>


        <!-- =========================================
             CARD INSIDE SCREEN
        ========================================== -->

        <div class="crt-card-stage">


          <div
            class="card"
            id="card"
          >


            <!-- FRONT -->

            <div class="card-face card-front">

              <div class="card-front-inner">

                <div
                  class="card-number"
                  id="cardFrontNumber"
                >
                  CARD 000
                </div>

                <div
                  class="card-title"
                  id="cardFrontTitle"
                >
                  DRAW A CARD
                </div>

              </div>

            </div>


            <!-- BACK -->

            <div class="card-face card-back">

              <div
                class="card-number"
                id="cardBackNumber"
              >
                CARD 000
              </div>

              <div
                class="card-story"
                id="cardStory"
              >
                The machine waits for a guest.
              </div>

            </div>


          </div>

        </div>


        <!-- =========================================
             BOTTOM HUD
        ========================================== -->

        <div class="hud-bottom">


          <div class="card-info">

            <div
              class="card-info-number"
              id="cardNumber"
            >
              CARD 000
            </div>

            <div
              class="card-info-title"
              id="cardTitle"
            >
              AWAITING GUEST
            </div>

          </div>


          <div class="collection-display">

            <div>
              COLLECTION
            </div>

            <div
              class="collection-number"
              id="collectionCount"
            >
              00 / 77
            </div>

          </div>


        </div>


      </div>

    </div>

  </div>


  <!-- ===============================================
       PHYSICAL CONTROL PANEL
  ================================================ -->

  <div class="control-panel">


    <div class="controls">


      <!-- JOYSTICK -->

      <div class="joystick"></div>


      <!-- DRAW BUTTON -->

      <button
        class="draw-button"
        id="drawButton"
      >
        DRAW
      </button>


      <!-- TOKEN SLOT -->

      <div class="token-slot">

        <div class="slot-hole"></div>

        <div class="slot-label">
          SENICX SLOT
        </div>

      </div>


    </div>


    <button
      class="reset-button"
      id="resetButton"
    >
      RESET GAME
    </button>


  </div>


</div>



<script>


/* =====================================================
   CARD DATABASE
===================================================== */

const cards = [

  {
    number: "001",
    title: "THE FOOL",
    story:
      "Every guest enters the hotel believing they are still going somewhere."
  },

  {
    number: "002",
    title: "THE WANDERER",
    story:
      "The corridor was longer than yesterday. Nobody remembered building another floor."
  },

  {
    number: "003",
    title: "THE VOID",
    story:
      "Some rooms contain nothing. Some rooms contain the reason you came."
  },

  {
    number: "004",
    title: "THE HOTEL",
    story:
      "Check-in is complimentary. Check-out is a matter of interpretation."
  },

  {
    number: "005",
    title: "THE PLAYGROUND",
    story:
      "The house has prepared a game for every guest. The house never loses."
  },

  {
    number: "006",
    title: "THE AFTERLIGHT",
    story:
      "When the lights finally disappear, something remains illuminated."
  }

];


/* =====================================================
   GAME STATE
===================================================== */

let tokens = Number(
  localStorage.getItem("senicxTokens")
);

if (Number.isNaN(tokens)) {
  tokens = 7;
}


let collection =
  JSON.parse(
    localStorage.getItem("abbissenicxCollection") || "[]"
  );


/* =====================================================
   ELEMENTS
===================================================== */

const drawButton =
  document.getElementById("drawButton");

const resetButton =
  document.getElementById("resetButton");

const card =
  document.getElementById("card");

const tokenCount =
  document.getElementById("tokenCount");

const collectionCount =
  document.getElementById("collectionCount");

const status =
  document.getElementById("status");

const cardNumber =
  document.getElementById("cardNumber");

const cardTitle =
  document.getElementById("cardTitle");

const cardFrontNumber =
  document.getElementById("cardFrontNumber");

const cardFrontTitle =
  document.getElementById("cardFrontTitle");

const cardBackNumber =
  document.getElementById("cardBackNumber");

const cardStory =
  document.getElementById("cardStory");


/* =====================================================
   DISPLAY UPDATE
===================================================== */

function updateDisplay() {

  tokenCount.textContent =
    String(tokens).padStart(2, "0");

  collectionCount.textContent =
    String(collection.length).padStart(2, "0")
    + " / 77";
}


/* =====================================================
   DRAW CARD
===================================================== */

drawButton.addEventListener("click", () => {


  if (tokens <= 0) {

    status.textContent =
      "SENICX EMPTY // MACHINE LOCKED";

    return;
  }


  /* spend SENICX */

  tokens--;

  localStorage.setItem(
    "senicxTokens",
    tokens
  );

  updateDisplay();


  /* return card to front */

  card.classList.remove("flipped");


  status.textContent =
    "SENICX ACCEPTED";


  setTimeout(() => {

    status.textContent =
      "SEARCHING CARD DATABASE...";

  }, 450);


  setTimeout(() => {

    status.textContent =
      "LOCATING GUEST RECORD...";

  }, 900);


  setTimeout(() => {


    /* random card */

    const selected =
      cards[
        Math.floor(
          Math.random() * cards.length
        )
      ];


    /* update card */

    cardFrontNumber.textContent =
      "CARD " + selected.number;

    cardFrontTitle.textContent =
      selected.title;

    cardBackNumber.textContent =
      "CARD " + selected.number;

    cardStory.textContent =
      selected.story;


    cardNumber.textContent =
      "CARD " + selected.number;

    cardTitle.textContent =
      selected.title;


    /* new or duplicate */

    if (!collection.includes(selected.number)) {


      collection.push(
        selected.number
      );


      localStorage.setItem(
        "abbissenicxCollection",
        JSON.stringify(collection)
      );


      status.textContent =
        "CARD FOUND // NEW ENTRY";


    } else {


      tokens++;

      localStorage.setItem(
        "senicxTokens",
        tokens
      );


      status.textContent =
        "DUPLICATE // SENICX RETURNED";

    }


    updateDisplay();


  }, 1350);

});


/* =====================================================
   CARD FLIP
===================================================== */

card.addEventListener("click", () => {


  if (
    cardNumber.textContent === "CARD 000"
  ) {
    return;
  }


  card.classList.toggle("flipped");

});


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener("click", () => {


  tokens = 7;

  collection = [];


  localStorage.setItem(
    "senicxTokens",
    tokens
  );


  localStorage.setItem(
    "abbissenicxCollection",
    JSON.stringify(collection)
  );


  card.classList.remove("flipped");


  cardFrontNumber.textContent =
