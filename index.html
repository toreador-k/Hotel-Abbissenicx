<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOTEL ABBISSENICX // THE PLAYGROUND</title>

<style>

@font-face {
  font-family: "Tickerbit Mono";
  src: url("fonts/Tickerbit-mono.woff") format("woff");
}

* {
  box-sizing: border-box;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: "Courier New", monospace;
  color: #eeeaff;

  background: #0a0619;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 40px 20px;

  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";

  position: fixed;
  inset: 0;

  z-index: -2;

  background:
    linear-gradient(
      rgba(10, 6, 25, 0.42),
      rgba(10, 6, 25, 0.58)
    ),
    url("images/background.webp");

  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;
}

/* =====================================================
   MACHINE
===================================================== */

.machine {

  width: min(820px, 96vw);

  position: relative;

  padding: 22px 22px 0;

  border-radius: 38px 38px 20px 20px;

  background:

    /* subtle metallic surface */
    linear-gradient(
      145deg,
      #dad9de 0%,
      #aaa8b0 16%,
      #77747d 42%,
      #9c99a2 67%,
      #66636c 100%
    );

  border: 3px solid #4c4952;

  box-shadow:

    /* machine shadow */
    0 48px 90px rgba(0,0,0,.78),

    0 18px 35px rgba(0,0,0,.55),

    /* outer metallic edge */
    inset 0 2px 0 rgba(255,255,255,.72),

    inset 0 0 0 1px rgba(255,255,255,.16),

    /* lower body depth */
    inset 0 -18px 30px rgba(0,0,0,.32),

    /* slight purple environment reflection */
    inset 0 0 80px rgba(65,35,100,.08);

}


/* subtle side depth */

.machine::after {

  content: "";

  position: absolute;

  z-index: -1;

  left: 12px;
  right: 12px;

  bottom: -14px;

  height: 24px;

  border-radius: 0 0 18px 18px;

  background:
    linear-gradient(
      180deg,
      #3d3a42,
      #1f1d23
    );

  box-shadow:
    0 8px 15px rgba(0,0,0,.55);
}


/* physical screws */

.machine::before {

  content: "";

  position: absolute;

  width: 10px;
  height: 10px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #eee,
      #888 40%,
      #444 75%
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.7),
    0 1px 2px rgba(0,0,0,.5);

  top: 15px;
  left: 18px;
}


/* =====================================================
   TOP LABEL
===================================================== */

.machine-top {
  position: relative;
  padding: 14px 24px 18px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.machine-brand {
  display: flex;
  justify-content: center;
  align-items: center;

  width: fit-content;
  max-width: 90%;

  min-height: 42px;
  padding: 6px 18px;

  border-radius: 8px;

  background:
    linear-gradient(
      180deg,
      #55515b 0%,
      #302d35 100%
    );

  border: 2px solid #403c45;

  box-shadow:
    inset 0 2px 0 rgba(255,255,255,.12),
    inset 0 -3px 6px rgba(0,0,0,.5),
    0 2px 4px rgba(0,0,0,.35);
}

.machine-brand img {
  display: block;

  width: 42px;
  height: 42px;

  object-fit: contain;

  filter:
    drop-shadow(0 1px 1px rgba(0,0,0,.7));
}

.brand-hotel,
.brand-name {
  font-family: "Courier New", monospace;

  font-size: 17px;
  font-weight: bold;

  letter-spacing: .16em;

  color: #f1eff5;

  text-shadow:
    0 1px 0 #555,
    0 2px 4px rgba(0,0,0,.5);

  white-space: nowrap;
}

.machine-floor {
  margin: 0;

  font-size: 10px;
  letter-spacing: .35em;

  color: #332b42;

  text-align: center;
}


/* =====================================================
   CRT OUTER FRAME
===================================================== */

.crt-frame {

  position: relative;

  padding: 27px;

  border-radius: 46px 46px 40px 40px;

  background:
    linear-gradient(
      145deg,
      #67636d 0%,
      #38353e 24%,
      #1e1c22 52%,
      #45414b 78%,
      #17161b 100%
    );

  border: 4px solid #35323b;

  box-shadow:

    inset 0 4px 5px rgba(255,255,255,.16),

    inset 0 -18px 30px rgba(0,0,0,.8),

    0 8px 12px rgba(0,0,0,.45);
}


/* inner bevel */

.crt-frame::before {

  content: "";

  position: absolute;

  inset: 9px;

  border-radius: 38px 38px 32px 32px;

  pointer-events: none;

  border: 1px solid rgba(255,255,255,.08);

  box-shadow:
    inset 0 3px 5px rgba(0,0,0,.6);
}


/* =====================================================
   CRT SCREEN
===================================================== */

.crt {

  position: relative;

  font-family: "Tickerbit Mono", monospace;

  width: 100%;
  height: 700px;

  overflow: hidden;

  border-radius: 45px / 34px;

  background:
    radial-gradient(
      ellipse at 50% 45%,
      #211536 0%,
      #100b19 45%,
      #07050a 75%,
      #020204 100%
    );

  border: 6px solid #100e14;

  box-shadow:

    /* deep recess */

    inset 0 0 0 3px rgba(0,0,0,.95),

    inset 0 0 25px rgba(0,0,0,.95),

    inset 0 0 65px rgba(0,0,0,.9),

    inset 0 0 120px rgba(30,10,55,.75),

    /* external CRT glow */

    0 0 20px rgba(80,22,220,.12),

    0 0 45px rgba(80,22,220,.06);
}


/* =====================================================
   CRT GLASS EDGE
===================================================== */

.crt::before {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 30;

  border-radius: inherit;

  background:

    linear-gradient(
      125deg,
      rgba(255,255,255,.12) 0%,
      rgba(255,255,255,.035) 17%,
      transparent 35%
    ),

    radial-gradient(
      ellipse at center,
      transparent 55%,
      rgba(0,0,0,.15) 75%,
      rgba(0,0,0,.65) 100%
    );
}


/* =====================================================
   CRT SCANLINES
===================================================== */

.crt::after {

  content: "";

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 40;

  background:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,.028) 0px,
      rgba(255,255,255,.028) 1px,
      rgba(0,0,0,.055) 2px,
      rgba(0,0,0,.055) 4px
    );

  mix-blend-mode: screen;

  opacity: .65;
}


/* =====================================================
   CRT UI
===================================================== */

.crt-ui {

  position: absolute;

  inset: 0;

  z-index: 10;

  display: flex;

  flex-direction: column;

  padding: 24px 30px 26px;
}


/* =====================================================
   TOP HUD
===================================================== */

.hud-top {

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 20px;

  flex-shrink: 0;
}


.hud-title {

  font-size: 13px;

  letter-spacing: .24em;

  color: #cfc6ff;

  text-shadow:
    0 0 7px rgba(100,70,255,.7);
}


.hud-status {

  margin-top: 7px;

  font-size: 9px;

  letter-spacing: .18em;

  color: #8f879f;

  min-height: 13px;
}


/* =====================================================
   SENICX DISPLAY
===================================================== */

.senicx-hud {

  position: relative;

  min-width: 205px;

  padding: 9px 14px 11px;

  border: 2px solid #676172;

  border-radius: 5px;

  background:
    linear-gradient(
      180deg,
      rgba(8,7,12,.96),
      rgba(22,18,31,.97)
    );

  box-shadow:

    inset 0 0 14px rgba(0,0,0,.95),

    inset 0 1px 0 rgba(255,255,255,.08),

    0 0 10px rgba(80,22,220,.12);
}


/* display glass */

.senicx-hud::after {

  content: "";

  position: absolute;

  inset: 4px;

  pointer-events: none;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.06),
      transparent 35%
    );
}


.senicx-label {

  font-size: 8px;

  letter-spacing: .28em;

  color: #88818f;

  text-align: center;
}


.senicx-value {

  margin-top: 2px;

  text-align: center;

  font-family: "Courier New", monospace;

  font-size: clamp(28px, 5vw, 43px);

  line-height: 1;

  font-weight: bold;

  letter-spacing: .08em;

  color: #f1eaff;

  text-shadow:

    0 0 4px #fff,

    0 0 12px rgba(80,22,220,.8),

    0 0 25px rgba(80,22,220,.45);
}


/* =====================================================
   CARD STAGE
===================================================== */

.crt-card-stage {

  flex: 1;

  min-height: 0;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 5px 0;

  position: relative;
}


/* subtle screen floor glow */

.crt-card-stage::before {
  content: "";
  position: absolute;
  inset: -8% -10%;

  background:
    url("images/inner-background.webp")
    center
    center
    / cover
    no-repeat;

  pointer-events: none;
  opacity: .35;
  z-index: 0;
}
  
.crt-card-stage::after {

  content: "";

  position: absolute;

  width: 55%;

  height: 20%;

  bottom: 9%;

  left: 22.5%;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse,
      rgba(80,22,220,.16),
      transparent 70%
    );

  filter: blur(14px);

  z-index: 1;
}


/* =====================================================
   CARD
===================================================== */

.card {

  position: relative;

  height: min(530px, 78%);

  aspect-ratio: 2156 / 3740;

  cursor: pointer;

  transform-style: preserve-3d;

  transition:
    transform .75s cubic-bezier(.2,.7,.2,1),
    filter .3s ease;

  filter:
  drop-shadow(0 14px 20px rgba(0,0,0,.8))
  drop-shadow(0 0 10px rgba(100,60,255,.18))
  drop-shadow(0 0 28px rgba(70,20,180,.10));

  z-index: 2;
}


.card:hover {

  filter:
    drop-shadow(0 20px 28px rgba(0,0,0,.8))
    drop-shadow(0 0 25px rgba(80,22,220,.3));
}


.card.flipped {

  transform: rotateY(180deg);
}


/* =====================================================
   CARD FACES
===================================================== */

.card-face {

  position: absolute;

  inset: 0;

  backface-visibility: hidden;

  border-radius: 8px;

  overflow: hidden;

  border: 2px solid rgba(230,225,255,.5);

  background:
    linear-gradient(
      145deg,
      #15111d,
      #08060c
    );

    box-shadow:

    inset 0 0 20px rgba(0,0,0,.75),

    inset 0 0 45px rgba(40,10,70,.25),

    0 0 0 1px rgba(0,0,0,.7),

    0 0 12px rgba(120,80,255,.10);
  
}


.card-front {

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 25px;

  text-align: center;
}


.card-front-inner {

  font-size: clamp(15px, 2vw, 22px);

  line-height: 1.4;

  letter-spacing: .18em;

  color: #eeeaff;

  text-shadow:
    0 0 10px rgba(80,22,220,.6);
}


.card-number {

  font-size: 10px;

  color: #8f879f;

  letter-spacing: .3em;

  margin-bottom: 12px;
}


.card-title {

  font-size: clamp(20px, 3vw, 32px);

  font-weight: bold;

  letter-spacing: .08em;
}


/* =====================================================
   CARD BACK
===================================================== */

.card-back {

  transform: rotateY(180deg);

  padding: 25px;

  display: flex;

  flex-direction: column;

  justify-content: center;

  text-align: left;
}


.card-back .card-number {

  margin-bottom: 15px;
}


.card-story {

  font-family: Georgia, serif;

  font-size: clamp(12px, 1.5vw, 15px);

  line-height: 1.65;

  color: #d9d2e8;
}


/* =====================================================
   BOTTOM HUD
===================================================== */

.hud-bottom {

  display: flex;

  justify-content: space-between;

  align-items: flex-end;

  gap: 20px;

  flex-shrink: 0;
}


.card-info {

  min-width: 0;
}


.card-info-number {

  font-size: 10px;

  letter-spacing: .25em;

  color: #817989;
}


.card-info-title {

  margin-top: 4px;

  font-size: 15px;

  letter-spacing: .12em;

  color: #eeeaff;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


.collection-display {

  text-align: right;

  font-size: 9px;

  line-height: 1.5;

  letter-spacing: .18em;

  color: #898291;
}


.collection-number {

  font-size: 17px;

  color: #e8e2ff;

  text-shadow:
    0 0 8px rgba(80,22,220,.6);
}


/* =====================================================
   CONTROL PANEL
===================================================== */

.control-panel {

  position: relative;

  margin: 0 -22px;

  padding: 24px 35px 30px;

  border-radius: 0 0 17px 17px;

  background:
    linear-gradient(
      180deg,
      #77747e 0%,
      #5d5a64 50%,
      #3f3c45 100%
    );

  border-top: 4px solid #89868f;

  box-shadow:

    inset 0 8px 15px rgba(255,255,255,.08),

    inset 0 -10px 20px rgba(0,0,0,.35),

    0 8px 12px rgba(0,0,0,.3);
}


/* panel seam */

.control-panel::before {

  content: "";

  position: absolute;

  left: 8%;
  right: 8%;

  top: 10px;

  height: 1px;

  background: rgba(0,0,0,.3);

  box-shadow:
    0 1px 0 rgba(255,255,255,.08);
}


/* =====================================================
   CONTROLS
===================================================== */

.controls {

  display: flex;

  justify-content: center;

  align-items: center;

  gap: 28px;
}


/* =====================================================
   JOYSTICK
===================================================== */

.joystick {

  position: relative;

  width: 58px;
  height: 58px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #57535e,
      #26232b 70%
    );

  border: 3px solid #29262e;

  box-shadow:

    inset 0 4px 5px rgba(255,255,255,.1),

    0 4px 5px rgba(0,0,0,.45);
}


.joystick::after {

  content: "";

  position: absolute;

  width: 25px;
  height: 25px;

  border-radius: 50%;

  left: 50%;
  top: 50%;

  transform: translate(-50%,-50%);

  background:
    radial-gradient(
      circle at 35% 30%,
      #a8a3af,
      #4a4650 70%
    );

  box-shadow:
    0 3px 4px rgba(0,0,0,.5);
}


/* =====================================================
   DRAW BUTTON
===================================================== */

.draw-button {

  width: 110px;
  height: 58px;

  border-radius: 10px;

  border: 3px solid #29252f;

  background:
    linear-gradient(
      145deg,
      #6c3bea,
      #3b0da8
    );

  color: white;

  font-family: "Courier New", monospace;

  font-weight: bold;

  font-size: 13px;

  letter-spacing: .12em;

  cursor: pointer;

  box-shadow:

    inset 0 2px 0 rgba(255,255,255,.25),

    inset 0 -6px 10px rgba(0,0,0,.3),

    0 5px 7px rgba(0,0,0,.45);

  transition:
    transform .08s ease,
    filter .2s ease;
}


.draw-button:hover {

  filter: brightness(1.15);
}


.draw-button:active {

  transform: translateY(4px);

  box-shadow:

    inset 0 3px 8px rgba(0,0,0,.5),

    0 1px 2px rgba(0,0,0,.4);
}


/* =====================================================
   TOKEN SLOT
===================================================== */

.token-slot {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 7px;
}


.slot-hole {

  width: 78px;
  height: 18px;

  border-radius: 10px;

  background: #18161c;

  border: 3px solid #2c2930;

  box-shadow:

    inset 0 3px 7px rgba(0,0,0,.9),

    0 1px 0 rgba(255,255,255,.12);
}


.slot-label {

  font-size: 8px;

  letter-spacing: .22em;

  color: #332f39;
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

  display: block;

  margin: 18px auto 0;

  border: none;

  background: transparent;

  color: #2e2a33;

  font-family: "Courier New", monospace;

  font-size: 8px;

  letter-spacing: .2em;

  cursor: pointer;

  opacity: .65;
}


.reset-button:hover {

  opacity: 1;

  color: #eeeaff;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  body {
    padding: 20px 10px;
  }

  .machine {
    padding: 14px 14px 0;
    border-radius: 25px 25px 14px 14px;
  }

  .crt-frame {
    padding: 13px;
    border-radius: 30px;
  }

  .crt {
    height: 610px;
    border-radius: 32px / 25px;
  }

  .crt-ui {
    padding: 18px 17px 20px;
  }

  .hud-top {
    gap: 8px;
  }

  .hud-title {
    font-size: 9px;
  }

  .hud-status {
    font-size: 7px;
  }

  .senicx-hud {
    min-width: 112px;
    padding: 7px 8px 9px;
  }

  .senicx-label {
    font-size: 6px;
  }

  .senicx-value {
    font-size: 27px;
  }

  .crt-card-stage {
    padding: 10px 0;
  }

  .card {
    height: min(390px, 65%);
  }

  .card-back {
    padding: 17px;
  }

  .card-story {
    font-size: 11px;
    line-height: 1.5;
  }

  .card-info-title {
    font-size: 11px;
  }

  .collection-display {
    font-size: 7px;
  }

  .collection-number {
    font-size: 13px;
  }

  .control-panel {
    margin: 0 -14px;
    padding: 18px 18px 23px;
  }

  .controls {
    gap: 16px;
  }

  .joystick {
    width: 48px;
    height: 48px;
  }

  .draw-button {
    width: 95px;
    height: 50px;
    font-size: 11px;
  }

  .slot-hole {
    width: 60px;
  }

}


/* =====================================================
   VERY SMALL SCREENS
===================================================== */

@media (max-height: 700px) and (min-width: 601px) {

  .crt {
    height: 570px;
  }

  .card {
    height: min(380px, 62%);
  }

}

</style>
</head>


<body>


<div class="machine">


  <!-- MACHINE TOP -->

  <div class="machine-top">

<div class="machine-brand">
  <span class="brand-hotel">HOTEL</span>
  <img src="images/logo.png" alt="Abbissenicx">
  <span class="brand-name">ABBISSENICX</span>
</div>

    <div class="machine-floor">
      FLOOR 2 : CASINO
    </div>

  </div>


  <!-- CRT FRAME -->

  <div class="crt-frame">

    <div class="crt">


      <!-- CRT UI -->

      <div class="crt-ui">


        <!-- TOP HUD -->

        <div class="hud-top">

          <div>

            <div class="hud-title">
              THE PLAYGROUND
            </div>

            <div
              class="hud-status"
              id="status"
            >
              INSERT SENICX TO BEGIN
            </div>

          </div>


          <!-- SENICX -->

          <div class="senicx-hud">

            <div class="senicx-label">
              SENICX
            </div>

            <div
              class="senicx-value"
              id="tokenCount"
            >
              07
            </div>

          </div>

        </div>


        <!-- CARD -->

        <div class="crt-card-stage">

          <div
            class="card"
            id="card"
          >

            <!-- FRONT -->

            <div class="card-face card-front">

              <div class="card-front-inner">

                <div
                  class="card-number"
                  id="cardFrontNumber"
                >
                  CARD 000
                </div>

                <div
                  class="card-title"
                  id="cardFrontTitle"
                >
                  DRAW A CARD
                </div>

              </div>

            </div>


            <!-- BACK -->

            <div class="card-face card-back">

              <div
                class="card-number"
                id="cardBackNumber"
              >
                CARD 000
              </div>

              <div
                class="card-story"
                id="cardStory"
              >
                The machine waits for a guest.
              </div>

            </div>

          </div>

        </div>


        <!-- BOTTOM HUD -->

        <div class="hud-bottom">

          <div class="card-info">

            <div
              class="card-info-number"
              id="cardNumber"
            >
              CARD 000
            </div>

            <div
              class="card-info-title"
              id="cardTitle"
            >
              AWAITING GUEST
            </div>

          </div>


          <div class="collection-display">

            <div>
              COLLECTION
            </div>

            <div
              class="collection-number"
              id="collectionCount"
            >
              00 / 77
            </div>

          </div>

        </div>


      </div>

    </div>

  </div>


  <!-- CONTROL PANEL -->

  <div class="control-panel">

    <div class="controls">

      <div class="joystick"></div>

      <button
        class="draw-button"
        id="drawButton"
      >
        DRAW
      </button>

      <div class="token-slot">

        <div class="slot-hole"></div>

        <div class="slot-label">
          SENICX SLOT
        </div>

      </div>

    </div>


    <button
      class="reset-button"
      id="resetButton"
    >
      RESET GAME
    </button>

  </div>


</div>



<script>


/* =====================================================
   CARD DATABASE
===================================================== */

const cards = [

  {
    number: "001",
    title: "THE FOOL",
    story:
      "Every guest enters the hotel believing they are still going somewhere."
  },

  {
    number: "002",
    title: "THE WANDERER",
    story:
      "The corridor was longer than yesterday. Nobody remembered building another floor."
  },

  {
    number: "003",
    title: "THE VOID",
    story:
      "Some rooms contain nothing. Some rooms contain the reason you came."
  },

  {
    number: "004",
    title: "THE HOTEL",
    story:
      "Check-in is complimentary. Check-out is a matter of interpretation."
  },

  {
    number: "005",
    title: "THE PLAYGROUND",
    story:
      "The house has prepared a game for every guest. The house never loses."
  },

  {
    number: "006",
    title: "THE AFTERLIGHT",
    story:
      "When the lights finally disappear, something remains illuminated."
  }

];


/* =====================================================
   GAME STATE
===================================================== */


/*
   V5.4 FIX:
   A brand-new visitor receives 07 SENICX.
*/

const savedTokens =
  localStorage.getItem("senicxTokens");

let tokens =
  savedTokens === null
    ? 7
    : Number(savedTokens);


let collection =
  JSON.parse(
    localStorage.getItem(
      "abbissenicxCollection"
    ) || "[]"
  );


/* =====================================================
   ELEMENTS
===================================================== */

const drawButton =
  document.getElementById("drawButton");

const resetButton =
  document.getElementById("resetButton");

const card =
  document.getElementById("card");

const tokenCount =
  document.getElementById("tokenCount");

const collectionCount =
  document.getElementById("collectionCount");

const status =
  document.getElementById("status");

const cardNumber =
  document.getElementById("cardNumber");

const cardTitle =
  document.getElementById("cardTitle");

const cardFrontNumber =
  document.getElementById("cardFrontNumber");

const cardFrontTitle =
  document.getElementById("cardFrontTitle");

const cardBackNumber =
  document.getElementById("cardBackNumber");

const cardStory =
  document.getElementById("cardStory");


/* =====================================================
   DISPLAY UPDATE
===================================================== */

function updateDisplay() {

  tokenCount.textContent =
    String(tokens).padStart(2, "0");

  collectionCount.textContent =
    String(collection.length).padStart(2, "0")
    + " / 77";
}


/* =====================================================
   DRAW CARD
===================================================== */

drawButton.addEventListener(
  "click",
  () => {

    if (tokens <= 0) {

      status.textContent =
        "SENICX EMPTY // MACHINE LOCKED";

      return;
    }


    /* spend SENICX */

    tokens--;

    localStorage.setItem(
      "senicxTokens",
      tokens
    );

    updateDisplay();


    /* return card to front */

    card.classList.remove("flipped");


    status.textContent =
      "SENICX ACCEPTED";


    setTimeout(
      () => {

        status.textContent =
          "SEARCHING CARD DATABASE...";

      },
      450
    );


    setTimeout(
      () => {

        status.textContent =
          "LOCATING GUEST RECORD...";

      },
      900
    );


    setTimeout(
      () => {


        /* random card */

        const selected =
          cards[
            Math.floor(
              Math.random() *
              cards.length
            )
          ];


        /* update card */

        cardFrontNumber.textContent =
          "CARD " + selected.number;

        cardFrontTitle.textContent =
          selected.title;

        cardBackNumber.textContent =
          "CARD " + selected.number;

        cardStory.textContent =
          selected.story;


        cardNumber.textContent =
          "CARD " + selected.number;

        cardTitle.textContent =
          selected.title;


        /* new or duplicate */

        if (
          !collection.includes(
            selected.number
          )
        ) {


          collection.push(
            selected.number
          );


          localStorage.setItem(
            "abbissenicxCollection",
            JSON.stringify(collection)
          );


          status.textContent =
            "CARD FOUND // NEW ENTRY";


        } else {


          tokens++;


          localStorage.setItem(
            "senicxTokens",
            tokens
          );


          status.textContent =
            "DUPLICATE // SENICX RETURNED";

        }


        updateDisplay();


      },
      1350
    );

  }
);


/* =====================================================
   CARD FLIP
===================================================== */

card.addEventListener(
  "click",
  () => {

    if (
      cardNumber.textContent ===
      "CARD 000"
    ) {

      return;
    }


    card.classList.toggle(
      "flipped"
    );

  }
);


/* =====================================================
   RESET
===================================================== */

resetButton.addEventListener(
  "click",
  () => {

    tokens = 7;

    collection = [];


    localStorage.setItem(
      "senicxTokens",
      tokens
    );


    localStorage.setItem(
      "abbissenicxCollection",
      JSON.stringify(collection)
    );


    card.classList.remove(
      "flipped"
    );


    cardFrontNumber.textContent =
      "CARD 000";

    cardFrontTitle.textContent =
      "DRAW A CARD";

    cardBackNumber.textContent =
      "CARD 000";

    cardStory.textContent =
      "The machine waits for a guest.";


    cardNumber.textContent =
      "CARD 000";

    cardTitle.textContent =
      "AWAITING GUEST";


    status.textContent =
      "INSERT SENICX TO BEGIN";


    updateDisplay();

  }
);


/* =====================================================
   INITIAL DISPLAY
===================================================== */

updateDisplay();

</script>


</body>
</html>
